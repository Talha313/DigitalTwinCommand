<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <title>Offline · Digital Twin Command Center</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #05070d; color: #f1f5f9; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 420px; text-align: center; }
    img { border-radius: 20px; }
    h1 { font-size: 28px; line-height: 1.2; }
    p { color: #a5b4c8; }
    a { display: inline-block; margin-top: 12px; padding: 12px 24px; border-radius: 12px; background: #22d3ee; color: #05070d; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="80" height="80" alt="">
    <h1>You're offline</h1>
    <p>Connect to the internet to access your dashboard and call controls.</p>
    <p>Going offline here does not necessarily end an active phone call.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
